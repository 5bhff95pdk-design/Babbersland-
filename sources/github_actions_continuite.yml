name: Continuité Babberland

# Contrôle à chaque push sur main et sur toute pull request :
# sources (continuité + couverture des illustrations), arbre déterministe,
# régénération du PDF canonique, artéfact publié, empreinte de fraîcheur, gel des archives.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  controles:
    name: Sources, artéfacts et empreinte
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Polices DejaVu (générateurs PDF et arbre)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      - name: Dépendances épinglées
        run: python -m pip install -r requirements.txt

      - name: Continuité des sources (canon, chronologie, archives, chroniques, ancres)
        run: python sources/check_continuity.py

      - name: Arbre généalogique déterministe
        run: |
          python sources/generate_genealogy.py
          git diff --exit-code --stat -- images/arbre_genealogique_complet.png

      - name: Régénération de l'encyclopédie 2026-I
        run: python sources/generate_encyclopedie_2026_i.py

      - name: Artéfact publié (légendes et illustrations embarquées)
        run: python sources/check_pdf.py

      - name: Fraîcheur du PDF publié (empreinte sémantique gravée)
        run: python sources/pdf_fingerprint.py --check

      - name: Gel des archives (G et H intacts)
        run: sha256sum --check --quiet gouvernance/ARCHIVE.sha256

      - name: Pièce jointe de relecture humaine
        uses: actions/upload-artifact@v4
        with:
          name: encyclopedie-2026-I
          path: Royaume_du_Babberland_Encyclopedie_Consolidee_2026_I.pdf
          if-no-files-found: error
