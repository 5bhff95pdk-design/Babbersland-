# Proposition de workflow GitHub Actions — à activer en copiant ce fichier vers .github/workflows/continuite.yml
# (le jeton de la session de révision ne disposait pas de la permission « workflows »)

name: Continuité Babberland

on:
  push:
    branches: [main]
  pull_request:

jobs:
  controles:
    name: Contrôles de continuité et régénération
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dépendances
        run: python -m pip install reportlab pillow pypdf

      - name: Polices DejaVu (arbre généalogique)
        run: sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      - name: Contrôles de continuité (sources)
        run: python sources/check_continuity.py

      - name: Arbre généalogique déterministe
        run: |
          python sources/generate_genealogy.py
          git diff --exit-code --stat -- images/arbre_genealogique_complet.png

      - name: Régénération du PDF canonique 2026-I
        run: python sources/generate_encyclopedie_2026_i.py

      - name: Vérification de l'artefact final
        run: python sources/check_pdf.py
