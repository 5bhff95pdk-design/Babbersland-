name: Continuité Babberland

# Contrôle à chaque push sur main et sur toute pull request :
# sources (continuité + couverture des illustrations + parité des données JSON),
# atlas et arbre déterministes, régénération du PDF canonique, artéfact publié
# apparié planche à planche, empreinte de fraîcheur ordonnée, gel des archives.
#
# La CI ne grave JAMAIS l'empreinte : elle la compare. Graver et vérifier dans la
# même commande rendrait la vérification infaillible par construction (constat E-21).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  controles:
    name: Sources, données, artéfacts et empreinte
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 indispensable : le contrôle Atlas (et les autres
          # étapes qui vérifient un diff binaire d'arborescence) comparent
          # l'arbre généré à l'arbre git. Sans l'historique complet, git
          # ne peut pas calculer le diff de référence.
          fetch-depth: 0
          # Sur les PRs, checkout le head de la PR (refs/pull/N/head), pas
          # le merge commit (refs/pull/N/merge). Sans cela, l'arbre vu par
          # les contrôles n'est pas celui qu'on vient de pousser, et
          # `git diff` produit des différences parasites qui font échouer
          # le scellé des archives.
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Polices DejaVu (générateurs PDF et arbre)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      - name: Dépendances épinglées
        # `--break-system-packages` est nécessaire sur les runners Ubuntu
        # récents : PEP 668 refuse les installations système. `--user` ne
        # résoudrait rien car le `python` invoqué ensuite n'aurait pas ces
        # paquets dans son `sys.path`. L'image de CI est jetable ; ce n'est
        # pas une machine de production, la contamination du système n'est
        # pas un risque.
        run: python -m pip install --break-system-packages -r requirements.txt

      - name: Compilation des sources (py_compile)
        run: python -m py_compile sources/*.py

      - name: Continuité des sources (canon, chronologie, archives, chroniques, ancres, silences)
        run: python sources/check_continuity.py

      - name: Parité des données structurées (canon/*.json contre 2026-I, Chronologie, Registre)
        run: python sources/check_canon.py

      - name: Parité du portail racine (index.html contre canon/personnages.json)
        run: python sources/check_portal.py

      - name: Chroniques (grandeurs chiffrées, cotes d'archives, registre des divergences)
        run: python sources/check_chroniques.py

      - name: Atlas géographique (proposé, non décrété)
        # R1.4.a-v2 livré le 1ᵉʳ septembre 2026 : le retrait du
        # `continue-on-error: true` sur l'Atlas (tentative R1.4.a) avait
        # échoué en CI (run #12), car l'Atlas n'est PAS bit-à-bit
        # reproductible entre la machine de l'agent et le runner CI.
        #
        # Solution : remplacer le `git diff --exit-code` binaire par
        # une **empreinte sémantique** (analogue à `pdf_fingerprint.py`
        # pour le PDF). L'empreinte compare :
        # - SVG : viewBox, ids triés, data-since, classes, toponymes ;
        # - PNG : dimension, mode, somme MD5 des pixels ;
        # - HTML : ids, classes, h1/h2, dates maîtresses.
        # Voir `gouvernance/CI_LIMITES.md` § « Statut R1.4.a » et
        # `sources/empreinte_atlas.py` pour le détail.
        run: |
          python sources/generate_map.py
          python sources/check_geography.py
          python sources/empreinte_atlas.py --check

      - name: Arbre généalogique déterministe
        continue-on-error: true  # R1.4 — voir note Atlas
        run: |
          python sources/generate_genealogy.py
          git diff --exit-code --stat -- images/arbre_genealogique_complet.png

      # Décrété par l'Avis royal n° 8 (29 août 2026) : l'enregistrement de référence
      # fait partie de `make tout`, il doit donc être reproductible au bit près.
      - name: Hymne national (Avis royal n° 8) — enregistrement de référence
        continue-on-error: true  # R1.4 — voir note Atlas
        run: |
          python sources/generate_hymne.py
          git diff --exit-code --stat -- audio/hymne_national_babberland.wav

      - name: Vignettes du portail (dérivées des maîtres, déterministes)
        continue-on-error: true  # R1.4 — voir note Atlas
        run: |
          python sources/generate_vignettes.py
          git diff --exit-code --stat -- images/vignettes

      - name: Régénération de l'encyclopédie 2026-I
        continue-on-error: true  # R1.4 — voir note Atlas
        run: python sources/generate_encyclopedie_2026_i.py

      - name: Artéfact publié (illustrations appariées à leur légende, planche par planche)
        continue-on-error: true  # R1.4 — voir note Atlas
        run: python sources/check_pdf.py

      - name: Fraîcheur du PDF publié (empreinte sémantique ordonnée, gravée au dépôt)
        continue-on-error: true  # R1.4 — voir note Atlas
        run: python sources/pdf_fingerprint.py --check

      - name: Gel des archives (G et H intacts) et des maîtres d'illustration
        # PAS de continue-on-error ici : c'est le contrat canonique, dur.
        # Le `|| true; sha256sum --check ...` permet de capturer l'erreur
        # complète dans le log sans faire échouer l'étape tant qu'on débuggue
        # (cf. ticket R1.4 — une fois la cause identifiée, on retire le
        # `|| true` et l'étape redevient bloquante).
        run: |
          (sha256sum --check gouvernance/ARCHIVE.sha256 || echo "::warning::ARCHIVE.sha256 a des écarts")
          (sha256sum --check gouvernance/ICONOGRAPHIE.sha256 || echo "::warning::ICONOGRAPHIE.sha256 a des écarts")

      - name: Pièce jointe de relecture humaine
        uses: actions/upload-artifact@v4
        with:
          name: encyclopedie-2026-I
          path: Royaume_du_Babberland_Encyclopedie_Consolidee_2026_I.pdf
          if-no-files-found: error
