name: Continuité Babberland

# Contrôle à chaque push sur main et sur toute pull request :
# sources (continuité + couverture des illustrations + parité des données JSON),
# quatre sceaux d'artéfacts régénérés (Atlas, Arbre, Hymne, Vignettes),
# régénération du PDF canonique, artéfact publié apparié planche à planche,
# empreinte de fraîcheur ordonnée, gel des archives.
#
# La CI ne grave JAMAIS l'empreinte : elle la compare. Graver et vérifier dans la
# même commande rendrait la vérification infaillible par construction (constat E-21).
#
# Depuis R1.4.c–g (1ᵉʳ septembre 2026), plus aucune étape n'est tolérante : chaque
# artéfact a un contrat SÉMANTIQUE (charge gravée en variantes acceptées, voir
# sources/sceaux.py) au lieu d'une comparaison d'octets — c'est ce qui rend le
# blocage supportable. La preuve que ces contrôles mordent se joue ailleurs :
# workflow `batterie.yml`, à horaire.
#
# `workflow_dispatch` : un run manuel à la demande (avant une Release, après un
# changement de police sur les runners, ou pour relire une annotation de divergence).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controles:
    name: Sources, données, artéfacts et empreinte
    runs-on: ubuntu-latest
    # Un run qui s'éternise n'est pas un run qui vérifie : 20 minutes couvrent
    # la chaîne complète (police + dépendances + 6 régénérations) avec de la marge.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 indispensable : le contrôle Atlas (et les autres
          # étapes qui vérifient un diff binaire d'arborescence) comparent
          # l'arbre généré à l'arbre git. Sans l'historique complet, git
          # ne peut pas calculer le diff de référence.
          fetch-depth: 0
          # Sur les PRs, checkout le head de la PR (refs/pull/N/head), pas
          # le merge commit (refs/pull/N/merge). Sans cela, l'arbre vu par
          # les contrôles n'est pas celui qu'on vient de pousser, et
          # `git diff` produit des différences parasites qui font échouer
          # le scellé des archives.
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Pas de cache pip (R1.4.a-v2) : le cache peut conserver une
          # version Pillow compilée différemment de celle qu'on installe
          # avec --break-system-packages, ce qui change le MD5 des pixels
          # du PNG de l'Atlas. Le coût : ~30s de plus par run.
          #cache: pip

      - name: Polices DejaVu (générateurs PDF et arbre)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      - name: Dépendances épinglées
        # `--break-system-packages` est nécessaire sur les runners Ubuntu
        # récents : PEP 668 refuse les installations système. `--user` ne
        # résoudrait rien car le `python` invoqué ensuite n'aurait pas ces
        # paquets dans son `sys.path`. L'image de CI est jetable ; ce n'est
        # pas une machine de production, la contamination du système n'est
        # pas un risque.
        run: python -m pip install --break-system-packages -r requirements.txt

      - name: Compilation des sources (py_compile)
        run: python -m py_compile sources/*.py

      - name: Gel des archives (G et H intacts), des maîtres d'illustration et de la galerie
        # R1.4.h (1ᵉʳ septembre 2026) : le contrat est redevenu STRICT — un écart
        # de scellé fait échouer le run.
        #
        # Placement : AVANT toute régénération, sur l'arbre de travail tel que
        # commité. Ce n'est pas une commodité : le runner régénère l'arbre
        # généalogique (`images/arbre_genealogique_complet.png`, couvert par
        # ICONOGRAPHIE.sha256) avec un rendu légitimement différent (FreeType
        # 2.12 ↔ 2.13, 3 cellules/256 — mesure R1.4.b). Vérifier le scellé
        # APRÈS régénération produisait un faux positif — c'est ce que le mode
        # diagnostic `|| echo "::warning::…"` masquait : l'annotation
        # « ICONOGRAPHIE.sha256 a des écarts » était posée sur chaque run,
        # y compris les verts.
        #
        # Le scellé protège les octets COMMITÉS (E-18) ; le rendu régénéré est
        # régi par son propre contrat : empreinte_arbre.py (étape bloquante,
        # variantes acceptées, R1.4.b).
        #
        # R1.9 (GALERIE.sha256) : `images/realistes/` (77 pièces, 211 Mio) était
        # le seul corpus d'images sans scellé — la charge des vignettes (R1.4.d)
        # ne regarde que les dérivés, donc un cliché retouché dont on oublie de
        # régénérer les vignettes passait (mesure : scénario J1bis de la batterie).
        # +77 lignes de scellé, 0 octet de plus à télécharger : les fichiers sont
        # déjà dans le checkout.
        run: |
          sha256sum --check --quiet gouvernance/ARCHIVE.sha256
          sha256sum --check --quiet gouvernance/ICONOGRAPHIE.sha256
          sha256sum --check --quiet gouvernance/GALERIE.sha256

      - name: Manifeste des livrables (R1.3) — bloquant
        # Les trois fichiers livrés du corpus canonique (2026-I, chronologie,
        # source vectorielle de l'arbre) n'avaient aucun scellé par octets :
        # ARCHIVE.sha256 ne scelle que les archives G/H, ICONOGRAPHIE/GALERIE
        # les images, pdf_fingerprint.txt la fraîcheur SÉMANTIQUE du PDF
        # (ses octets sont non-déterministes). Un changement de contenu du canon
        # doit donc être un ACTE — re-graver le manifeste dans le même commit —
        # pas une retouche silencieuse (fin de E-13). Ici on VÉRIFIE, on ne grave
        # jamais : la CI compare, conformément au constat E-21.
        run: python sources/check_manifest.py --check

      - name: Parité modèle ↔ workflow installé (R1.8)
        # `make workflows` pose les copies côte à côte ; rien ne vérifiait qu'elles
        # concordent. Un `.github/workflows/*.yml` modifié à la main — ou un modèle
        # oublié de resynchroniser — désaligne la chaîne de son contrat, en silence :
        # la classe de dérive que quatre audits ont poursuivie ailleurs (E-09, C-01).
        # Nota : ce run exécute le YAML installé ; si les deux fichiers divergent,
        # c'est peut-être LE MODÈLE qui porte la vérité — l'échec ne tranche pas,
        # il force la question. Deux fichiers, une comparaison d'octets, zéro coût.
        run: |
          cmp sources/github_actions_continuite.yml .github/workflows/continuite.yml
          cmp sources/github_actions_batterie.yml .github/workflows/batterie.yml
          echo "workflows installés fidèles à leurs modèles."

      - name: Continuité des sources (canon, chronologie, archives, chroniques, ancres, silences)
        run: python sources/check_continuity.py

      - name: Garde des silences (Avis royal n° 10 — registre ↔ Serment, fixations, lacunes non décrétées)
        # R2.7 (2 septembre 2026) : le Serment promettait depuis le 30 août que la
        # chaîne « rejette toute fixation arbitraire » ; la promesse ne tenait que
        # pour deux silences sur cinq proclamés, et trois listes se contredisaient.
        # `canon/silences.json` est désormais la source unique, le Serment en est le
        # miroir, et cette étape est bloquante d'emblée — une lacune non décrétée
        # est une dette, pas un mystère.
        run: python sources/check_silences.py

      - name: Parité des données structurées (canon/*.json contre 2026-I, Chronologie, Registre)
        run: python sources/check_canon.py

      - name: Parité du portail racine (index.html contre canon/personnages.json)
        run: python sources/check_portal.py

      - name: Chroniques (grandeurs chiffrées, cotes d'archives, registre des divergences)
        run: python sources/check_chroniques.py

      - name: Atlas géographique (proposé, non décrété) — bloquant
        # R1.4.a-v3 (1ᵉʳ septembre 2026) : l'étape appelait `generate_map.py` puis
        # `check_geography.py`, sous `continue-on-error`, SANS jamais consulter
        # l'empreinte livée en v2. Le contrat existait donc dans le dépôt et pas
        # dans la chaîne — exactement la classe de défaut E-09 (une vérification
        # qui ne vérifie rien). L'empreinte est reprise sur le modèle de l'Arbre
        # (variantes acceptées, composante fautive nommée dans l'annotation), et
        # l'étape devient bloquante.
        #
        # Le PNG n'est plus comparé par échantillonnage NEAREST 16×16 (un pixel lu
        # sur cent : trop fragile, c'est pourquoi v2 n'osait pas brancher l'étape)
        # mais par moyennage BOX quantifié sur 16 niveaux + proportion d'encre.
        # Une région retirée, un fond changé, un calage temporel faux bloquent ;
        # l'antialiasing d'un autre FreeType ne bloque plus — ou alors il s'accepte,
        # en connaissance de cause, par `--accepter`.
        run: |
          python sources/generate_map.py
          python sources/check_geography.py
          python sources/empreinte_atlas.py --check

      - name: Arbre généalogique (variantes de rendu acceptées, bloquant)
        # R1.4.b (1ᵉʳ septembre 2026) : `git diff --exit-code` et
        # `continue-on-error: true` remplacés par l'empreinte sémantique
        # « variantes acceptées » de sources/empreinte_arbre.py.
        # Mesure PR #26 : entre la machine de référence et le runner, le
        # rendu diverge sur 3 cellules 16x16 d'un niveau de quantification
        # (FreeType 2.12 vs 2.13) — pile dans la zone où vit la plus
        # petite retouche de contenu (2 cellules). Aucune tolérance
        # chiffrée ne sépare les deux : on accepte donc EXACTEMENT les
        # variantes gravées dans gouvernance/ARTIFACT_SIGNATURES.sha256
        # (reference-locale, ci-ubuntu-24.04-py3.12) ; toute autre est
        # une dérive bloquante, diagnostiquée par annotation de check-run
        # (canal lisible — les journaux Azure Blob ne le sont pas depuis
        # l'environnement d'agent, douleur R1.4.a-v2).
        run: |
          python sources/generate_genealogy.py
          python sources/empreinte_arbre.py --check

      # Décrété par l'Avis royal n° 8 (29 août 2026) : l'enregistrement de référence
      # fait partie de `make tout`, il doit donc être reproductible.
      #
      # R1.4.c (1ᵉʳ septembre 2026) : `git diff --exit-code` comparait des OCTETS. La
      # synthèse n'utilise que la bibliothèque standard (graine 1847), mais un ULP
      # de `math.sin` dans une autre libm — ou un chunk RIFF ajouté par une autre
      # version de `wave` — change le fichier sans changer une note. La charge
      # compare donc ce qui s'entend : géométrie du signal, enveloppe RMS par
      # fenêtre de 250 ms, PCM replié sur 8 bits, amplitude crête. L'audit RIFF
      # promis par le ticket est fait : le WAV ne contient que `fmt ` et `data`,
      # aucun horodatage (tout chunk hors de ce paire est signalé au diagnostic).
      - name: Hymne national (Avis royal n° 8) — enregistrement de référence, bloquant
        run: |
          python sources/generate_hymne.py
          python sources/empreinte_hymne.py --check
          python sources/empreinte_hymne.py --chunks

      # R1.4.d (1ᵉʳ septembre 2026) : idem pour les 77 vignettes WebP, dérivées de
      # `images/realistes/*.png`. Le `git diff` avait un angle mort de plus : une
      # vignette périmée que la machine de référence reproduit à l'identique passait.
      # La charge compare le CONTENU DÉCODÉ (grille 8×8 par vignette, lot haché),
      # donc un ré-encodage libwebp différent n'est pas une faute, tandis qu'un
      # maître oublié de régénérer en est une.
      - name: Vignettes du portail (dérivées des maîtres) — bloquant
        run: |
          python sources/generate_vignettes.py
          python sources/empreinte_vignettes.py --check

      # R1.4.e–g (1ᵉʳ septembre 2026) : les trois étapes de la chaîne du PDF
      # portaient `continue-on-error: true  # R1.4 — voir note Atlas`, par
      # héritage — le motif invoqué (non-reproductibilité binaire) ne les
      # concernait pas : elles ne comparent pas des octets. Une étape qui
      # régénère sans vérifier peut donc échouer en silence, et deux `--check`
      # bloquants pouvaient dire vrai sans que le run bronche. Retirés.
      - name: Régénération de l'encyclopédie 2026-I — bloquant
        run: python sources/generate_encyclopedie_2026_i.py

      - name: Artéfact publié (illustrations appariées à leur légende, planche par planche) — bloquant
        run: python sources/check_pdf.py

      # Le contrat de référence est l'empreinte gravée par `make empreinte`.
      # Un rendu d'un autre environnement qui diverge (pagination sensible aux
      # polices) ne rend pas la chaîne rouge par surprise : il la rend rouge par
      # annotation, puis s'accepte à la main dans la section `PDF CANONIQUE` de
      # gouvernance/ARTIFACT_SIGNATURES.sha256 (R1.4.g). Rien de tout cela
      # n'excuse une dérive sur la machine de référence : là, on re-grave.
      - name: Fraîcheur du PDF publié (empreinte sémantique ordonnée, gravée au dépôt) — bloquant
        run: python sources/pdf_fingerprint.py --check

      - name: Pièce jointe de relecture humaine
        uses: actions/upload-artifact@v4
        with:
          name: encyclopedie-2026-I
          path: Royaume_du_Babberland_Encyclopedie_Consolidee_2026_I.pdf
          if-no-files-found: error
